name: publish
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check site.js
      - run: node tests/test_site_js.js
      - run: node scripts/check-assets.js

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/ashenstudio/ashencraft-site:latest
      - name: Prune Docker space before the pull (disk-full incident lesson)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          curl -fsS -X POST -H "X-API-Key: $PORTAINER_API_KEY" \
            "$PORTAINER_URL/api/endpoints/3/docker/images/prune" \
            -H "Content-Type: application/json" -d '{"filters":{}}' || true
          curl -fsS -X POST -H "X-API-Key: $PORTAINER_API_KEY" \
            "$PORTAINER_URL/api/endpoints/3/docker/build/prune" || true
      - name: Redeploy the ashen-website stack (checked-out compose)
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: ${{ secrets.STACK_ID }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request
          base = os.environ["PORTAINER_URL"].rstrip("/")
          key = os.environ["PORTAINER_API_KEY"]
          stack_id = os.environ["STACK_ID"]
          body = json.dumps({
              "StackFileContent": open("docker-compose.yml").read(),
              "Env": [
                  {"name": "WEBSITE_PORT", "value": "8081"},
                  {"name": "MAP_URL", "value": "https://map.ashencraft.overdev.net"},
                  {"name": "API_URL", "value": "https://ashenapi.overdev.net"},
                  {"name": "DISCORD_INVITE", "value": "https://discord.gg/Y6nk7vnMzY"},
              ],
              "Prune": True,
              "PullImage": True,
          }).encode()
          req = urllib.request.Request(
              f"{base}/api/stacks/{stack_id}?endpointId=3",
              data=body, method="PUT",
              headers={"X-API-Key": key, "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=180) as resp:
              print("redeploy status:", resp.status)
          EOF